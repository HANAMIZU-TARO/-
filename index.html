<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バカゲーコレクション Ver 1.04</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap');
        
        body { 
            margin: 0; padding: 0; background: #121212; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; font-family: 'M PLUS Rounded 1c', sans-serif; 
            overflow: hidden; 
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 最初の成功時と同じ「375x667」固定レイアウト */
        #smartphone-frame { 
            width: 375px; height: 667px; 
            background: #1a1a1a; position: relative; overflow: hidden; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            /* iPadなどで画面からはみ出さないよう調整 */
            transform-origin: center center;
        }

        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; z-index: 10; }
        .bg-gradient { background: radial-gradient(circle at top, #2c3e50, #000000); }

        .game-card { width: 85%; background: rgba(255,255,255,0.1); border-radius: 20px; padding: 15px; margin: 10px 0; display: flex; align-items: center; cursor: pointer; border: 2px solid rgba(255,255,255,0.05); }
        .card-title { font-weight: 900; font-size: 1.1rem; color: #fffa65; }
        .card-desc { font-size: 0.75rem; color: white; opacity: 0.8; }

        .btn { background: #00cec9; color: #fff; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.2rem; font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 #00b894; margin: 5px; }
        #back-to-menu-btn { position: absolute; top: 15px; left: 15px; background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 15px; border-radius: 15px; font-weight: 900; z-index: 100; cursor: pointer; font-size: 0.8rem; display: none; }

        #ui-gameover { background: rgba(0,0,0,0.9); z-index: 120; color: white; display: none; flex-direction: column; justify-content: center; align-items: center; position: absolute; top:0; left:0; width:100%; height:100%; }
        #hud { position: absolute; top: 15px; width: 100%; display: flex; justify-content: center; z-index: 50; pointer-events: none; }
        .hud-text { background: rgba(0,0,0,0.6); padding: 5px 20px; border-radius: 20px; color: #fffa65; font-weight: bold; border: 1px solid #fffa65; }

        #countdown-layer { position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index: 110; display:none; flex-direction:column; justify-content:center; align-items:center; }
        #count-num { font-weight: 900; text-align: center; height: 120px; display: flex; align-items: center; justify-content: center; }
        
        .critical { color: #ff4757; font-weight: 900; font-size: 1.6rem; }
        #version-tag { position: absolute; top: 10px; right: 15px; color: rgba(255,255,255,0.4); font-size: 0.8rem; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
<div id="smartphone-frame">
    <div id="version-tag">Ver 1.04</div>
    <button id="back-to-menu-btn" onclick="GameEngine.changeScreen('screen-menu')">🏠 メニュー</button>

    <div id="screen-title" class="screen bg-gradient" style="display: flex;">
        <h1 style="font-size: 2.2rem; color: #fff; margin-top:150px; text-align:center;">バカゲー<br><span style="color:#fffa65">だいしゅうごう</span></h1>
        <div style="font-size: 5rem; margin: 20px 0;">🤪</div>
        <p style="color:white; opacity: 0.6; font-size: 1.1rem;">画面をタッチ！</p>
        <div style="position:absolute; top:0; left:0; width:100%; height:100%; cursor:pointer; z-index:20;" onclick="GameEngine.handleTitleClick()"></div>
    </div>

    <div id="screen-menu" class="screen bg-gradient">
        <h2 style="color:white; margin-top: 50px;">どれであそぶ？</h2>
        <div class="game-card" onclick="GameEngine.startGame('can')">
            <div style="font-size:2.5rem; margin-right:15px;">🚀</div>
            <div class="card-info"><div class="card-title">うちゅうカンけり</div><div class="card-desc">頂点で花火ドカン！</div></div>
        </div>
        <div class="game-card" onclick="GameEngine.startGame('ito')">
            <div style="font-size:2.5rem; margin-right:15px;">🧶</div>
            <div class="card-info"><div class="card-title">ギリギリ糸とおし</div><div class="card-desc">ヌルヌル動くしっぽを切らすな！</div></div>
        </div>
        <div class="game-card" onclick="GameEngine.startGame('giri')">
            <div style="font-size:2.5rem; margin-right:15px;">🏃</div>
            <div class="card-info"><div class="card-title">かわまでチキンレース</div><div class="card-desc">堤防から落ちるな！</div></div>
        </div>
    </div>

    <div id="screen-game" class="screen" style="background: #000;">
        <div id="hud"><div id="ui-score" class="hud-text">スコア: 0</div></div>
        <div id="countdown-layer">
            <div id="count-num">3</div>
            <div id="count-help" style="color:white; font-size:0.9rem; margin-top:20px; text-align:center; padding:0 40px;"></div>
        </div>
        <canvas id="mainCanvas" width="375" height="667"></canvas>
        <div id="ui-gameover">
            <div style="font-size: 1.5rem; color:#fffa65; font-weight:900; margin-bottom: 10px;">★ けっか発表 ★</div>
            <p id="result-text" style="font-size: 1.1rem; margin: 15px 0; text-align:center; padding:0 20px;"></p>
            <button class="btn" style="background:#ff4757;" onclick="GameEngine.retry()">もういっかい！</button>
            <button class="btn" style="background:#636e72;" onclick="GameEngine.changeScreen('screen-menu')">メニューへ</button>
        </div>
    </div>
</div>

<script>
/** 音源システム */
const AudioSys = {
    ctx: null, bgmInterval: null,
    init: function() {
        if(this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    },
    resume: function() {
        if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    playTone: function(freq, type, dur, vol) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + dur);
    },
    se: function(name) {
        if(!this.ctx) return;
        if(name === 'count') this.playTone(880, 'square', 0.1, 0.05); 
        if(name === 'go') this.playTone(1760, 'square', 0.4, 0.05);   
        if(name === 'kick') this.playTone(400, 'sawtooth', 0.3, 0.05); 
        if(name === 'exp') this.playTone(100, 'square', 0.8, 0.1); 
        if(name === 'hit') this.playTone(150, 'sawtooth', 0.2, 0.1); 
    }
};

const GameEngine = {
    canvas: document.getElementById('mainCanvas'),
    ctx: document.getElementById('mainCanvas').getContext('2d'),
    state: 'idle', currentGame: null, particles: [],

    init: function() {
        // iPadなどで縮小表示する処理
        const scale = Math.min(window.innerWidth / 375, window.innerHeight / 667);
        if (scale < 1) document.getElementById('smartphone-frame').style.transform = `scale(${scale})`;

        this.canvas.addEventListener('pointerdown', (e) => {
            if(this.state === 'playing') this.currentGame.onPress();
        });
        this.canvas.addEventListener('pointerup', (e) => {
            if(this.state === 'playing' && this.currentGame?.onRelease) this.currentGame.onRelease();
        });
        this.changeScreen('screen-title');
    },

    handleTitleClick: function() {
        AudioSys.init();
        AudioSys.resume();
        this.changeScreen('screen-menu');
    },

    changeScreen: function(id) {
        if(this.timer) clearInterval(this.timer);
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'flex';
        document.getElementById('back-to-menu-btn').style.display = (id === 'screen-game') ? 'block' : 'none';
        this.state = (id === 'screen-game') ? 'playing' : 'idle';
    },

    startGame: function(mode) {
        AudioSys.resume();
        document.getElementById('ui-gameover').style.display = 'none';
        if(mode === 'can') this.currentGame = new CanGame(this.canvas);
        else if(mode === 'ito') this.currentGame = new ItoGame(this.canvas);
        else if(mode === 'giri') this.currentGame = new GiriGame(this.canvas);
        this.currentGame.init();
        this.startCountdown();
    },

    startCountdown: function() {
        this.state = 'countdown';
        const layer = document.getElementById('countdown-layer');
        const num = document.getElementById('count-num');
        layer.style.display = 'flex';
        document.getElementById('count-help').innerText = this.currentGame.help;
        let count = 3;
        const update = () => {
            if(count > 0) { num.innerText = count; AudioSys.se('count'); }
            else { num.innerText = "GO!"; AudioSys.se('go'); }
        };
        update();
        this.timer = setInterval(() => {
            count--;
            if(count >= 0) update();
            else {
                clearInterval(this.timer);
                layer.style.display = 'none';
                this.state = 'playing';
                this.mainLoop();
            }
        }, 900);
    },

    retry: function() { this.startGame(this.currentGame.mode); },

    mainLoop: function() {
        if(this.state !== 'playing' && this.state !== 'ending') return;
        this.ctx.clearRect(0,0,375,667);
        this.currentGame.update();
        this.currentGame.draw(this.ctx);
        this.updateParticles();
        requestAnimationFrame(() => this.mainLoop());
    },

    spawn: function(x,y,color,count=20) {
        for(let i=0;i<count;i++) this.particles.push({x,y,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:1,color});
    },

    updateParticles: function() {
        for(let i=this.particles.length-1;i>=0;i--) {
            let p=this.particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=0.02;
            this.ctx.fillStyle=p.color; this.ctx.globalAlpha=p.life;
            this.ctx.fillRect(p.x,p.y,4,4); this.ctx.globalAlpha=1;
            if(p.life<=0) this.particles.splice(i,1);
        }
    },

    endGame: function(msg) {
        this.state = 'ending';
        document.getElementById('result-text').innerHTML = msg;
        document.getElementById('ui-gameover').style.display = 'flex';
    }
};

/** 1. カンけり */
class CanGame {
    constructor(canvas) { this.w=375; this.h=667; this.mode='can'; this.help="パワーと角度で飛ばせ！"; }
    init() {
        this.can={x:187,y:550,vx:0,vy:0,rot:0,dead:false}; this.state='power'; this.gauge=0; this.dir=1; this.camY=0; this.maxH=0;
        this.env=[]; for(let i=0;i<50;i++) this.env.push({x:Math.random()*300+30, y:i*-250+400, t:["☁️","🚀","🛸"][Math.floor(Math.random()*3)]});
    }
    onPress() {
        if(this.state==='power') this.state='angle';
        else if(this.state==='angle') {
            let rad = (this.gauge*0.9)*Math.PI/180;
            this.can.vx=Math.cos(rad)*15; this.can.vy=-Math.sin(rad)*30; this.state='flying'; AudioSys.se('kick');
        }
    }
    update() {
        if(this.state==='power' || this.state==='angle') { this.gauge+=3*this.dir; if(this.gauge>100||this.gauge<0) this.dir*=-1; }
        else if(this.state==='flying') {
            this.can.vy+=0.5; this.can.x+=this.can.vx; this.can.y+=this.can.vy; this.can.rot+=0.2;
            this.camY = Math.min(this.camY, this.can.y-300);
            this.maxH = Math.max(this.maxH, Math.floor(550-this.can.y));
            if(this.can.vy>0 && !this.can.dead) { 
                this.can.dead=true; AudioSys.se('exp'); GameEngine.spawn(this.can.x,this.can.y,"#fffa65",50);
                let msg = this.maxH>2000?"宇宙到達！":"もっと飛ばそう！";
                GameEngine.endGame(`たかさ: ${this.maxH}m<br>${msg}`);
            }
        }
        document.getElementById('ui-score').innerText = `たかさ: ${this.maxH}m`;
    }
    draw(ctx) {
        ctx.fillStyle='#87ceeb'; ctx.fillRect(0,0,375,667);
        ctx.save(); ctx.translate(0, -this.camY);
        ctx.font='30px Arial'; this.env.forEach(e=>ctx.fillText(e.t, e.x, e.y));
        ctx.fillStyle='#2ecc71'; ctx.fillRect(0,580,375,500);
        if(!this.can.dead) { ctx.save(); ctx.translate(this.can.x,this.can.y); ctx.rotate(this.can.rot); ctx.fillText('🥫',-20,20); ctx.restore(); }
        ctx.restore();
    }
}

/** 2. 糸とおし */
class ItoGame {
    constructor(canvas) { this.w=375; this.h=667; this.mode='ito'; this.help="おして上昇！しっぽを切らすな！"; }
    init() { this.y=333; this.vy=0; this.score=0; this.walls=[]; this.frame=0; this.isPress=false; }
    onPress() { this.isPress=true; }
    onRelease() { this.isPress=false; }
    update() {
        this.vy += this.isPress?-0.8:0.5; this.y+=this.vy;
        if(this.frame++%60===0) this.walls.push({x:375,y:Math.random()*400+100,scored:false});
        this.walls.forEach(w=>{
            w.x-=5;
            if(w.x<100 && w.x>50 && (this.y<w.y || this.y>w.y+150)) { AudioSys.se('hit'); GameEngine.endGame(`スコア: ${this.score}<br>どんまい！`); }
            if(w.x<50 && !w.scored) { w.scored=true; this.score++; }
        });
        document.getElementById('ui-score').innerText = `スコア: ${this.score}`;
    }
    draw(ctx) {
        ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,375,667);
        ctx.fillStyle='#fffa65'; ctx.beginPath(); ctx.arc(100,this.y,10,0,Math.PI*2); ctx.fill();
        this.walls.forEach(w=>{ ctx.fillStyle='#ff4757'; ctx.fillRect(w.x,0,30,w.y); ctx.fillRect(w.x,w.y+150,30,667); });
    }
}

/** 3. チキンレース */
class GiriGame {
    constructor(canvas) { this.w=375; this.h=667; this.mode='giri'; this.help="おしてダッシュ！はなしてブレーキ！"; }
    init() { this.x=40; this.vx=0; this.state='ready'; }
    onPress() { if(this.state==='ready') this.state='go'; }
    onRelease() { if(this.state==='go') this.state='brake'; }
    update() {
        if(this.state==='go') this.vx+=0.5;
        else if(this.state==='brake') { this.vx*=0.9; if(this.vx<0.1) { this.vx=0; this.judge(); } }
        this.x+=this.vx;
        if(this.x>330 && this.state!=='falling') this.state='falling';
        if(this.state==='falling') { 
            this.x+=5; if(this.x>400) { AudioSys.se('splash'); GameEngine.endGame("ドボーン！<br>0点ｗ"); }
        }
    }
    judge() {
        let point = Math.max(0, 100-Math.floor(330-this.x));
        let msg = point>90?"神！":point>50?"やるな":"ビビりすぎｗ";
        GameEngine.endGame(`スコア: ${point}<br>${msg}`);
    }
    draw(ctx) {
        ctx.fillStyle='#87ceeb'; ctx.fillRect(0,0,375,667);
        // 雲の描画
        ctx.fillStyle='#fff'; [ [50,100], [200,80], [300,120] ].forEach(p=>ctx.fillText('☁️',p[0],p[1]));
        ctx.fillStyle='#8b4513'; ctx.fillRect(0,550,330,200);
        ctx.fillStyle='#1a5276'; ctx.fillRect(330,550,45,200);
        ctx.font='50px Arial'; ctx.fillText('🏃',this.x,540);
    }
}

GameEngine.init();
</script>
</body>
</html>
